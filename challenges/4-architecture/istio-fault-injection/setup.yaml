apiVersion: v1
kind: Namespace
metadata:
  name: cnpe-fault
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cnpe-fault
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cnpe-fault
spec:
  ports:
  - port: 80
    name: http
  selector:
    app: backend
