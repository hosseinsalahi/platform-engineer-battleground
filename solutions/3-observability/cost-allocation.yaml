apiVersion: v1
kind: Namespace
metadata:
  name: cnpe-team-alpha
  labels:
    cost-center: cc-platform
    team: alpha
    environment: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-test-app
  namespace: cnpe-team-alpha
  labels:
    cost-center: cc-platform
    team: alpha
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cost-test
  template:
    metadata:
      labels:
        app: cost-test
        cost-center: cc-platform
        team: alpha
        environment: dev
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
